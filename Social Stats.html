<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Stats</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23e5091c'/%3E%3Cpath d='M32 8 38.5 25.1 56.7 26 42.5 37.4 47.3 55 32 45 16.7 55 21.5 37.4 7.3 26 25.5 25.1Z' fill='%230a0a0a' stroke='%23f5f5f0' stroke-width='3' stroke-linejoin='miter'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#e5091c;--ink:#0a0a0a;--paper:#f5f5f0;--dim:#8a8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#e5091c;--ink:#0a0a0a;--paper:#f5f5f0;--dim:#8a8a8a}}
:root[data-theme="dark"]{--red:#e5091c;--ink:#0a0a0a;--paper:#f5f5f0;--dim:#8a8a8a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--paper);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:500;font-size:18px;min-height:100vh;
 background-image:radial-gradient(circle at 1px 1px,#2a0a0d 1.5px,transparent 0);background-size:14px 14px;overflow-x:hidden}
.display{font-family:Anton,Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.02em;text-transform:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.title{font-size:clamp(46px,10vw,92px);line-height:.9;margin:0;color:var(--paper);transform:rotate(-3deg) skewX(-6deg);transform-origin:left bottom;
 text-shadow:5px 5px 0 var(--red)}
.sub{margin:8px 0 0 4px;color:var(--dim);font-size:17px}
.total{background:var(--red);color:var(--paper);padding:8px 18px 8px 22px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);text-align:center;line-height:1}
.total b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px}
.ah{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:30px 0 10px}.ah h2{margin:0}.undo{background:var(--paper);color:var(--ink);font-family:Anton,Impact,sans-serif;font-size:18px;padding:6px 18px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}.undo:hover:not(:disabled){background:var(--red);color:var(--paper)}.undo:disabled{opacity:.35;cursor:default}
.tw{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.today{background:var(--paper);color:var(--ink);padding:8px 18px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);text-align:center;line-height:1}.today b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.radar{background:var(--paper);color:var(--ink);padding:14px;clip-path:polygon(0 0,100% 4%,100% 100%,0 96%);position:relative}
.radar svg{display:block;width:100%;height:auto;max-width:430px;margin:0 auto}
.rlabel{font-family:Anton,Impact,sans-serif;font-size:15px;fill:var(--ink)}
.stats{display:flex;flex-direction:column;gap:10px}
.row{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;
 background:var(--paper);color:var(--ink);padding:10px 22px 10px 18px;clip-path:polygon(0 0,100% 0,97% 100%,2% 100%);transition:transform .12s,background .12s,color .12s}
.row:nth-child(even){margin-left:18px;width:calc(100% - 18px)}
.row:hover,.row:focus-visible{background:var(--red);color:var(--paper);transform:translateX(6px)}
.rname{font-family:Anton,Impact,sans-serif;font-size:28px;line-height:1}
.rdesc{font-size:15px;opacity:.75;grid-column:1}
.rank{grid-row:1/3;grid-column:2;text-align:right;line-height:1}
.rank small{display:block;font-size:13px;font-weight:700}
.rank b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:46px}
.rank b.max{color:var(--red)}
.row:hover .rank b.max,.row:focus-visible .rank b.max{color:var(--ink)}
.bar{grid-column:1/3;height:10px;background:var(--ink);transform:skewX(-20deg);margin-top:2px;position:relative}
.bar i{position:absolute;inset:2px auto 2px 2px;background:var(--red);transition:width .5s;display:block}
.row:hover .bar i,.row:focus-visible .bar i{background:var(--paper)}
.xptxt{grid-column:1/3;font-size:14px;font-weight:700;display:flex;justify-content:space-between}
h2{margin:30px 0 10px;font-size:34px;color:var(--red);transform:skewX(-6deg)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;gap:12px;align-items:baseline;background:#161616;border-left:6px solid var(--red);padding:7px 12px}
.log .amt{font-family:Anton,Impact,sans-serif;color:var(--red);min-width:64px}
.log .when{margin-left:auto;color:var(--dim);font-size:14px;white-space:nowrap}
.empty{color:var(--dim);padding:6px 0}
.reset{margin-top:26px;background:transparent;color:var(--dim);text-decoration:underline;padding:4px 0;font-size:15px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.on{display:flex}
.card{width:min(460px,100%);background:var(--paper);color:var(--ink);padding:22px 24px 24px;clip-path:polygon(0 0,100% 3%,100% 100%,0 97%);position:relative}
.card h3{margin:0 0 2px;font-size:40px;color:var(--red);line-height:1}
.card p{margin:0 0 14px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.opt{background:var(--ink);color:var(--paper);padding:10px 4px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);line-height:1.05}
.opt b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;color:var(--red)}
.opt:hover,.opt:focus-visible{background:var(--red)}
.opt:hover b,.opt:focus-visible b{color:var(--paper)}
.card input{width:100%;font:inherit;padding:9px 10px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.close{position:absolute;top:10px;right:16px;background:none;color:var(--ink);font-family:Anton,Impact,sans-serif;font-size:26px}
/* rank up */
.up{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);overflow:hidden}
.up.on{display:flex}
.band{background:var(--red);width:130%;padding:30px 0 34px;text-align:center;transform:rotate(-6deg);border-block:10px solid var(--paper);animation:slam .45s cubic-bezier(.2,1.4,.4,1) both}
.band .big{font-size:clamp(60px,16vw,150px);line-height:.95;color:var(--paper);text-shadow:6px 6px 0 var(--ink);display:block}
.band .what{font-family:Anton,Impact,sans-serif;font-size:clamp(26px,6vw,48px);color:var(--ink);background:var(--paper);display:inline-block;padding:2px 22px;margin-top:8px;transform:skewX(-10deg)}
@keyframes slam{from{transform:translateX(-120%) rotate(-6deg)}to{transform:translateX(0) rotate(-6deg)}}
body{animation:dots 40s linear infinite}
@keyframes dots{to{background-position:140px 140px}}
@keyframes fade{from{opacity:0}}
.title{animation:titleIn .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes titleIn{from{opacity:0;transform:translateX(-60px) rotate(-3deg) skewX(-6deg)}to{opacity:1;transform:rotate(-3deg) skewX(-6deg)}}
.tw>*{animation:dropIn .5s cubic-bezier(.2,1.3,.4,1) both}.tw>*:nth-child(2){animation-delay:.1s}
@keyframes dropIn{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.radar{animation:popIn .55s .1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.88) rotate(-3deg)}to{opacity:1;transform:none}}
.rpoly{transform-box:view-box;transform-origin:50% 50%;animation:grow .6s .1s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes grow{from{transform:scale(.05);opacity:0}to{transform:none;opacity:1}}
.intro .row{animation:rowIn .5s cubic-bezier(.2,1.2,.4,1) backwards;animation-delay:calc(var(--i)*70ms + 200ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
.row.pulse{animation:pulse .6s ease}
@keyframes pulse{0%{transform:none}30%{transform:scale(1.04) translateX(6px);background:var(--red);color:var(--paper)}100%{transform:none}}
.row:active,.opt:active,.undo:active{transform:scale(.96)}
.opt{transition:transform .1s,background .12s}
.log li:first-child{animation:rowIn .4s backwards}
.scrim.on{animation:fade .2s}
.scrim.on .card{animation:cardIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) rotate(3deg) scale(.9)}}
.up.on{animation:fade .15s}
.up.on::before{content:"";position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.band .big{animation:thump .6s .25s ease both}
@keyframes thump{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:none}}
.band .what{animation:fade .4s .5s both}
@media (prefers-reduced-motion:reduce){html:not([data-motion="on"]) *,html:not([data-motion="on"]) *::before,html:not([data-motion="on"]) *::after{animation:none!important;transition:none!important}}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{animation:none!important;transition:none!important}
</style>
</head>
<body class="intro">
<div class="wrap">
  <header>
    <div>
      <h1 class="title display">Social Stats</h1>
      <p class="sub">Tap a stat to log what you did today.</p>
    </div>
    <div class="tw"><div class="today"><span>Today</span><b id="today">0</b></div><div class="total"><span>Total XP</span><b id="total">0</b></div></div>
  </header>

  <div class="grid">
    <div class="radar" aria-label="Stat overview">
      <svg id="radar" viewBox="0 0 340 320" role="img" aria-label="Radar chart of your six stats"></svg>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="ah"><h2 class="display">Recent activity</h2><button class="undo" id="undo" type="button">Undo last</button></div>
  <ul class="log" id="log"></ul>
  <button class="reset" id="reset">Reset all progress</button>
  <button class="reset" id="motion" type="button" style="margin-left:18px"></button>
</div>

<div class="scrim" id="scrim">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mname">
    <button class="close" id="close" aria-label="Close">X</button>
    <h3 class="display" id="mname"></h3>
    <p id="mdesc"></p>
    <div class="opts">
      <button class="opt" data-xp="10"><b>+10</b>Small step</button>
      <button class="opt" data-xp="25"><b>+25</b>Solid effort</button>
      <button class="opt" data-xp="50"><b>+50</b>Big win</button>
    </div>
    <input id="note" type="text" maxlength="80" placeholder="What did you do? (optional)" aria-label="What did you do?">
  </div>
</div>

<div class="up" id="up" role="alert"><div class="band"><span class="big display">Rank Up!</span><span class="what" id="upwhat"></span></div></div>

<script>
const STATS=[
 {k:"knowledge",n:"Knowledge",d:"Intelligence, learning and understanding"},
 {k:"strength",n:"Strength",d:"Physical fitness and health"},
 {k:"guts",n:"Guts",d:"Courage, resilience and leaving your comfort zone"},
 {k:"charm",n:"Charm",d:"Social skills, confidence and communication"},
 {k:"kindness",n:"Kindness",d:"Generosity, empathy and helping others"},
 {k:"competence",n:"Competence",d:"Practical skills, independence and getting things done"}
];
const CUM=[0,1000,4000,10000,20000]; // total XP needed for ranks 1..5 (3-year mode)
const CAP=Infinity; // no daily cap
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#e5091c;color:#f5f5f0;padding:10px 22px;font-family:Anton,Impact,sans-serif;z-index:40;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);text-align:center";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2800)}
const KEY="p5stats.v1";let PREV={},LAST=null;
let S={xp:{},log:[],day:{d:"",xp:0}};
STATS.forEach(s=>S.xp[s.k]=0);
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.xp){S.xp=Object.assign(S.xp,p.xp);S.log=Array.isArray(p.log)?p.log:[];if(p.day&&typeof p.day.xp==="number")S.day=p.day}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function info(xp){let r=1;for(let i=0;i<5;i++)if(xp>=CUM[i])r=i+1;
 if(r===5)return{r,cur:xp-CUM[4],need:0,frac:1};
 const need=CUM[r]-CUM[r-1],cur=xp-CUM[r-1];return{r,cur,need,frac:cur/need}}
const $=id=>document.getElementById(id);
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderStats(){
 $("stats").innerHTML=STATS.map((s,ix)=>{const i=info(S.xp[s.k]);
  const txt=i.r===5?"MAX RANK":i.cur+" / "+i.need+" XP";
  return `<button class="row" data-k="${s.k}" style="--i:${ix}"><span><span class="rname">${s.n}</span></span>
   <span class="rank"><small>RANK</small><b class="${i.r===5?"max":""}">${i.r}</b></span>
   <span class="rdesc">${s.d}</span>
   <span class="bar"><i data-w="${(i.frac*100).toFixed(1)}" style="width:calc(${PREV[s.k]||0}% - 4px)"></i></span>
   <span class="xptxt"><span>${txt}</span><span>${S.xp[s.k]} total</span></span></button>`}).join("");
 requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll("#stats .row").forEach(r=>{const i=r.querySelector(".bar i");i.style.width="calc("+i.dataset.w+"% - 4px)";PREV[r.dataset.k]=+i.dataset.w})}));
if(LAST){const r=document.querySelector('#stats .row[data-k="'+LAST+'"]');if(r)r.classList.add("pulse");LAST=null}
$("total").textContent=Object.values(S.xp).reduce((a,b)=>a+b,0);$("today").textContent=S.day.d===today()?S.day.xp:0;
}
function renderRadar(){
 const cx=170,cy=160,R=105,n=STATS.length;
 const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
 let g="";
 for(let L=1;L<=5;L++){g+=`<polygon points="${STATS.map((_,i)=>pt(i,L/5).join(",")).join(" ")}" fill="none" stroke="#0a0a0a" stroke-opacity="${L===5?1:.25}" stroke-width="${L===5?3:1}"/>`}
 STATS.forEach((_,i)=>{const p=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#0a0a0a" stroke-opacity=".25"/>`});
 const pts=STATS.map((s,i)=>{const f=info(S.xp[s.k]);const t=f.r===5?1:(f.r-1+f.frac)/4;return pt(i,.08+.92*t).join(",")}).join(" ");
 g+=`<polygon class="rpoly" points="${pts}" fill="#e5091c" fill-opacity=".85" stroke="#0a0a0a" stroke-width="3" stroke-linejoin="miter"/>`;
 STATS.forEach((s,i)=>{const p=pt(i,1.2);const a=i===0?"middle":(p[0]>cx+5?"start":(p[0]<cx-5?"end":"middle"));
  g+=`<text class="rlabel" x="${p[0]}" y="${p[1]+5}" text-anchor="${a}">${s.n}</text>`});
 $("radar").innerHTML=g;
}
function ago(t){const m=Math.floor((Date.now()-t)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.floor(m/60);if(h<24)return h+" h ago";return new Date(t).toLocaleDateString()}
function renderLog(){
 const l=S.log.slice(0,8);
 $("log").innerHTML=l.length?l.map(e=>{const s=STATS.find(x=>x.k===e.k);
  return `<li><span class="amt">+${e.xp} XP</span><span><b>${s.n}</b>${e.note?" – "+esc(e.note):""}</span><span class="when">${ago(e.t)}</span></li>`}).join(""):`<li class="empty" style="border:0;background:none">Nothing logged yet. Pick a stat and log your first action.</li>`;
}
function render(){renderStats();renderRadar();renderLog();$("undo").disabled=!S.log.length}

let cur=null;
function openModal(k){cur=STATS.find(s=>s.k===k);$("mname").textContent=cur.n;$("mdesc").textContent=cur.d;$("note").value="";$("scrim").classList.add("on");setTimeout(()=>document.querySelector(".opt").focus(),0)}
function closeModal(){$("scrim").classList.remove("on");cur=null}
let upT;
function add(k,xp,note){
 const td=today();if(S.day.d!==td)S.day={d:td,xp:0};const left=CAP-S.day.xp;if(left<=0){toast("Daily cap reached. Come back tomorrow.");return}xp=Math.min(xp,left);S.day.xp+=xp;const before=info(S.xp[k]).r;S.xp[k]+=xp;const after=info(S.xp[k]).r;
 S.log.unshift({k,xp,note,t:Date.now(),d:td});S.log=S.log.slice(0,50);save();LAST=k;render();showUndo(k,xp);
 if(after>before){$("upwhat").textContent=STATS.find(s=>s.k===k).n+" – Rank "+after;
  $("up").classList.add("on");clearTimeout(upT);upT=setTimeout(()=>$("up").classList.remove("on"),2600)}
}
$("stats").addEventListener("click",e=>{const b=e.target.closest(".row");if(b)openModal(b.dataset.k)});
document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{if(!cur)return;const k=cur.k;const note=$("note").value.trim();closeModal();add(k,+b.dataset.xp,note)}));
function hideUndo(){const b=document.getElementById("undobar");if(b)b.style.display="none"}
function undoLast(){const e=S.log.shift();if(!e){toast("Nothing to undo.");return}
S.xp[e.k]=Math.max(0,S.xp[e.k]-e.xp);
const dd=e.d||(()=>{const x=new Date(e.t);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()})();
if(S.day.d===dd)S.day.xp=Math.max(0,S.day.xp-e.xp);
save();render();hideUndo();toast("Undid +"+e.xp+" XP "+STATS.find(s=>s.k===e.k).n)}
function showUndo(k,xp){let b=document.getElementById("undobar");if(!b){b=document.createElement("div");b.id="undobar";b.style.cssText="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f5f5f0;color:#0a0a0a;padding:8px 10px 8px 22px;display:flex;gap:14px;align-items:center;z-index:41;clip-path:polygon(2% 0,100% 0,98% 100%,0 100%);white-space:nowrap;font-weight:700";document.body.appendChild(b)}
b.innerHTML='<span></span><button type="button" style="background:#e5091c;color:#f5f5f0;font-family:Anton,Impact,sans-serif;font-size:18px;padding:6px 16px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)">Undo</button>';
b.firstChild.textContent="+"+xp+" XP "+STATS.find(s=>s.k===k).n;
b.lastChild.onclick=undoLast;b.style.display="flex";clearTimeout(b._t);b._t=setTimeout(()=>b.style.display="none",6000)}
$("undo").addEventListener("click",undoLast);
setTimeout(()=>document.body.classList.remove("intro"),1600);
const MKEY="p5motion";let MO=null;try{MO=localStorage.getItem(MKEY)}catch(e){}
const sysReduced=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
const motionOn=()=>MO?MO==="on":!sysReduced();
function motionLabel(){$("motion").textContent="Animations: "+(motionOn()?"On":"Off")}
if(MO)document.documentElement.dataset.motion=MO;motionLabel();
$("motion").addEventListener("click",()=>{const wasOn=motionOn();MO=wasOn?"off":"on";document.documentElement.dataset.motion=MO;try{localStorage.setItem(MKEY,MO)}catch(e){}motionLabel();
if(!wasOn){PREV={};document.body.classList.add("intro");render();setTimeout(()=>document.body.classList.remove("intro"),1600)}});
(function(){try{const P=[[32,8],[38.5,25.1],[56.7,26],[42.5,37.4],[47.3,55],[32,45],[16.7,55],[21.5,37.4],[7.3,26],[25.5,25.1]];
const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
x.fillStyle="#e5091c";x.fillRect(0,0,512,512);
x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0]*8,p[1]*8):x.moveTo(p[0]*8,p[1]*8));x.closePath();
x.fillStyle="#0a0a0a";x.lineWidth=22;x.strokeStyle="#f5f5f0";x.lineJoin="miter";x.stroke();x.fill();
const u=c.toDataURL("image/png");
